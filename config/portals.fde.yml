# Named companies (the morning tracker; see ARCHITECTURE.md). `watchlist:` is the company name
# scripts/check-watchlist.mjs reports under; every one of these is checked each morning.
- name: Qualcomm
  careers_url: https://careers.qualcomm.com/careers
  provider: extra-boards
  board: pcsx
  pcsx:
    domain: qualcomm.com
    location: United States
    max_pages: 2
    searches:
    - filters:
        seniority: Entry
        job_family: software engineering
    - filters:
        seniority: Entry
        job_family: machine learning engineering
    - query: college graduate
    - query: new college grad
  watchlist: Qualcomm
  notes: named company; Eightfold PCSX search through integrations/extra-boards (the eightfold provider's API is refused here)
  enabled: true
