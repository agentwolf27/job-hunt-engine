# Scan list for career-ops: FDE, AI/ML and Data Engineer roles (early career). Merge these keys into career-ops/portals.yml.
# Built 2026-10-01 from a live check of the Greenhouse, Ashby and Lever public APIs (scripts/fde_spike.py).
# The counts in notes are FDE-type openings on that day.

title_filter:
  positive:
  - Forward Deployed
  - Deployed Engineer
  - FDE
  - Deployment Strategist
  - Deployment Lead
  - Applied AI Engineer
  - Solutions Engineer
  - Customer Engineer
  - AI Engineer
  - New Grad
  - Early Career
  - University Grad
  - Entry Level
  - Associate Software Engineer
  - Data Engineer
  - ML Engineer
  - Machine Learning Engineer
  - AI/ML Engineer
  - AI/ML
  - LLM Engineer
  - GenAI Engineer
  - Generative AI Engineer
  - Applied ML
  - Applied Scientist
  - Software Engineer, AI
  - Software Engineer, ML
  - Software Engineer, Machine Learning
  - Software Engineer, Data
  # Entry-level titles at the named companies (added 2026-10-13). Kept narrow on purpose:
  # scan.mjs has one title filter for every company, so each of these also applies to all of them.
  # "a + b" means both must be in the title; "word:" means the phrase must end at a word boundary.
  - college grad + software
  - college grad + data
  - college grad + machine learning
  - college grad + ai
  - college grad + automation
  - college grad + analyst
  - recent grad + software
  - graduate + software engineer
  - junior + software
  - software engineer + associate
  - Associate Software Developer
  - word:software engineer i
  - word:software engineer 1
  - word:software developer i
  - word:software development engineer i
  - word:sde i
  - software + 2026
  - software + 2027
  - front-end engineer + 2026
  negative:
  - Intern
  - Recruiter
  - Sales Development
  - Account Executive
  - Senior
  - Sr.
  - 'Sr '
  - Staff
  - Principal
  - Lead
  - Manager
  - Director
  - Head of
  - VP
  - Distinguished
  - Architect
  - ' III'
  - ' IV'
  - Co-op
  - Coop
search_queries:
- name: FDE on ATS boards (web)
  query: site:jobs.ashbyhq.com OR site:job-boards.greenhouse.io OR site:jobs.lever.co "Forward Deployed Engineer"
  enabled: true
